<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildgalleri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kontainer">
        <h1>Bildgalleri</h1>
        <p class="intro">Hej hej, detta är en bildgalleri med bilder från min dator.</p>
        <div class="box">
            <img src="/kapitel-3/galleri/istockphoto-610771802-1024x1024.jpg" alt="bild på frukter">
            <p class="bildtext">Detta är en bild på frukter. Jag gillar bär, dem smakar gott.</p>
        </div>
        <div class="box">
            <img src="/kapitel-3/galleri/scones.png" alt="scones">
            <p class="bildtext">Detta är en bild på scones. Jag gillar scones, dem smakar gott.</p>
        </div>
        <div class="box">
            <img src="/kapitel-3/galleri/högskoleprovet.jpg" alt="högskoleprov">
            <p class="bildtext">Detta är en bild på högskoleprovet. jag gillar inte högskoleprovet, det smakar inte gott.</p>
        </div>
    </div>
</body>
</html>
